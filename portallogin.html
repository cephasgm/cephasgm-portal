<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portal Login — Cephas GM</title>

<!-- PWA Manifest -->
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#0b7a59">

<!-- SEO -->
<meta name="description" content="Secure login to the Cephas GM Portal — unified control plane for enterprise projects, OHS systems, AI platforms, and infrastructure optimisation.">
<meta name="robots" content="noindex, nofollow">

<!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }
  body {
    font-family: 'Poppins', sans-serif;
    color: #fff;
    background: linear-gradient(rgba(0,0,0,0.72), rgba(0,0,0,0.85)), url('https://images.unsplash.com/photo-1506744038136-46273834b3fb?auto=format&fit=crop&w=1470&q=80');
    background-size: cover;
    background-position: center;
    background-attachment: fixed;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    position: relative;
    padding: 20px 0 80px;
  }
  /* Liquid crystal overlay — unchanged */
  body::before {
    content: '';
    position: fixed;
    top: 0; left: 0; width: 100%; height: 100%;
    background: linear-gradient(125deg, rgba(11,122,89,0.08) 0%, rgba(100,200,255,0.05) 25%, rgba(11,122,89,0.08) 50%, rgba(200,100,255,0.05) 75%, rgba(11,122,89,0.08) 100%);
    background-size: 300% 300%;
    animation: liquidCrystal 12s ease infinite;
    pointer-events: none;
    z-index: 0;
  }
  @keyframes liquidCrystal {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }

  /* ---------- Login box ---------- */
  .login-box {
    background: rgba(255,255,255,0.08);
    padding: 2.5rem 2rem;
    border-radius: 16px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.4);
    backdrop-filter: blur(14px);
    width: 100%;
    max-width: 420px;
    border: 1px solid rgba(255,255,255,0.12);
    position: relative;
    z-index: 1;
    animation: boxIn .4s ease;
  }
  @keyframes boxIn {
    from { opacity: 0; transform: translateY(12px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .brand-link {
    display: inline-block;
    font-size: .82rem;
    color: #34d399;
    text-decoration: none;
    padding: 5px 12px;
    border-radius: 20px;
    background: rgba(11,122,89,0.18);
    border: 1px solid rgba(52,211,153,0.3);
    margin-bottom: 1.2rem;
    font-weight: 500;
    transition: .3s;
  }
  .brand-link:hover {
    background: rgba(11,122,89,0.35);
    color: #fff;
  }

  h1 {
    color: #34d399;
    margin-bottom: 0.4rem;
    font-size: 1.75rem;
    font-weight: 700;
    line-height: 1.25;
  }
  .subtitle {
    color: #ccc;
    font-size: .9rem;
    margin-bottom: 1.6rem;
    line-height: 1.5;
  }

  label {
    display: block;
    font-size: .82rem;
    color: #ccc;
    margin-bottom: 6px;
    margin-top: 10px;
    font-weight: 500;
  }

  input {
    display: block;
    width: 100%;
    padding: 0.85rem 1rem;
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 8px;
    background: rgba(255,255,255,0.06);
    color: #fff;
    font-family: 'Poppins', sans-serif;
    font-size: .95rem;
    transition: border-color .2s, background .2s, box-shadow .2s;
  }
  input::placeholder {
    color: rgba(255,255,255,0.45);
  }
  input:focus {
    outline: none;
    border-color: #0b7a59;
    background: rgba(255,255,255,0.1);
    box-shadow: 0 0 0 3px rgba(11,122,89,0.15);
  }

  button {
    width: 100%;
    padding: 0.85rem;
    margin-top: 1.4rem;
    background: #0b7a59;
    color: #fff;
    border: none;
    border-radius: 8px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.3s;
    font-size: .98rem;
    font-family: 'Poppins', sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }
  button:hover {
    background: #099268;
    transform: translateY(-2px);
    box-shadow: 0 6px 16px rgba(11,122,89,0.35);
  }
  button:disabled {
    opacity: 0.65;
    cursor: not-allowed;
    transform: none;
    box-shadow: none;
  }
  .btn-spinner {
    width: 15px; height: 15px;
    border: 2px solid rgba(255,255,255,0.4);
    border-top-color: #fff;
    border-radius: 50%;
    animation: spin .6s linear infinite;
    display: inline-block;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .back-link {
    color: #ccc;
    text-decoration: none;
    font-size: .88rem;
    display: block;
    margin-top: 1.2rem;
    text-align: center;
    transition: color .2s;
  }
  .back-link:hover {
    color: #34d399;
  }

  /* ---------- Messages ---------- */
  .error-message,
  .success-message {
    margin-top: 12px;
    font-size: .87rem;
    display: none;
    padding: 10px 12px;
    border-radius: 8px;
    text-align: center;
    line-height: 1.5;
  }
  .error-message {
    color: #ffb3b3;
    background: rgba(192,57,43,0.18);
    border: 1px solid rgba(192,57,43,0.4);
  }
  .success-message {
    color: #a7f3d0;
    background: rgba(11,122,89,0.2);
    border: 1px solid rgba(52,211,153,0.4);
  }

  /* ---------- Footer ---------- */
  footer {
    position: absolute;
    bottom: 0;
    width: 100%;
    text-align: center;
    padding: 1.1rem;
    background: rgba(0,0,0,0.9);
    color: #ccc;
    font-size: .88rem;
    border-top: 1px solid rgba(255,255,255,0.08);
    position: fixed;
    left: 0;
    z-index: 2;
  }

  @media (max-width: 500px) {
    .login-box {
      padding: 2rem 1.5rem;
    }
    h1 { font-size: 1.5rem; }
    .subtitle { font-size: .85rem; }
  }
</style>
</head>
<body>

<div class="login-box">
  <a href="index.html" class="brand-link">← Cephas GM Portal</a>
  <h1>🔐 Portal Login</h1>
  <p class="subtitle">Sign in to access your projects, downloads, accounting, and admin tools.</p>

  <form id="loginForm" autocomplete="on">
    <label for="email">Email address</label>
    <input type="email" id="email" placeholder="you@example.com" required autocomplete="email" autofocus>

    <label for="password">Password</label>
    <input type="password" id="password" placeholder="••••••••" required autocomplete="current-password">

    <div class="error-message" id="loginError"></div>
    <div class="success-message" id="loginSuccess">Login successful — redirecting...</div>

    <button type="submit" id="loginBtn">Sign In</button>
  </form>

  <a href="index.html" class="back-link">← Back to Portal Home</a>
</div>

<footer>Copyright © 2025 Cephas GM | Innovating for Tomorrow</footer>

<script>
  /* ============================================================
     FIREBASE CONFIG — unchanged
  ============================================================ */
  const firebaseConfig = {
    apiKey: "AIzaSyA2vWoAkdbke0D_x8N1W3JAzDVj4vcsZSE",
    authDomain: "cephasgm-portal.firebaseapp.com",
    projectId: "cephasgm-portal",
    storageBucket: "cephasgm-portal.firebasestorage.app",
    messagingSenderId: "577322740819",
    appId: "1:577322740819:web:da7bfaf387fb690bc96aa6",
    measurementId: "G-KC2XDEJPRV"
  };
  if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
  const auth = firebase.auth();

  /* ============================================================
     CONSTANTS
  ============================================================ */
  const ADMIN_EMAILS = ["admin@cephasgm.org", "admin@cephasgm.com"];

  /* ============================================================
     DOM
  ============================================================ */
  const loginForm = document.getElementById('loginForm');
  const emailInput = document.getElementById('email');
  const passwordInput = document.getElementById('password');
  const loginBtn = document.getElementById('loginBtn');
  const errorDiv = document.getElementById('loginError');
  const successDiv = document.getElementById('loginSuccess');

  /* ============================================================
     ALREADY LOGGED IN — auto-redirect
  ============================================================ */
  auth.onAuthStateChanged((user) => {
    if (user && !sessionStorage.getItem('login_just_completed')) {
      const isAdmin = ADMIN_EMAILS.includes(user.email.toLowerCase());
      window.location.href = isAdmin ? 'portaladmin.html' : 'portaldashboard.html';
    }
  });

  /* ============================================================
     HELPERS
  ============================================================ */
  function showError(message) {
    errorDiv.textContent = message;
    errorDiv.style.display = 'block';
    successDiv.style.display = 'none';
  }
  function hideMessages() {
    errorDiv.style.display = 'none';
    successDiv.style.display = 'none';
  }

  /* ============================================================
     LOGIN
  ============================================================ */
  loginForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    hideMessages();

    const email = emailInput.value.trim();
    const password = passwordInput.value;

    if (!email || !password) {
      showError('Please enter both email and password.');
      return;
    }

    // Disable button + show spinner
    loginBtn.disabled = true;
    const originalText = loginBtn.textContent;
    loginBtn.innerHTML = '<span class="btn-spinner"></span> Authenticating...';

    try {
      const userCredential = await auth.signInWithEmailAndPassword(email, password);
      const user = userCredential.user;

      // Mark session so onAuthStateChanged doesn't double-redirect
      sessionStorage.setItem('login_just_completed', '1');

      // Show success
      successDiv.style.display = 'block';

      // Determine redirect target
      const isAdmin = ADMIN_EMAILS.includes(user.email.toLowerCase());
      const destination = isAdmin ? 'portaladmin.html' : 'portaldashboard.html';

      // Brief delay so the user sees the success state
      setTimeout(() => {
        sessionStorage.removeItem('login_just_completed');
        window.location.href = destination;
      }, 900);

    } catch (error) {
      console.error('Login error:', error.code, error.message);

      // Map Firebase error codes to friendly messages
      let errorMessage = 'Login failed. Please try again.';
      switch (error.code) {
        case 'auth/invalid-email':
          errorMessage = 'That email address does not look valid.';
          break;
        case 'auth/user-disabled':
          errorMessage = 'This account has been disabled. Contact admin@cephasgm.org.';
          break;
        case 'auth/user-not-found':
          errorMessage = 'No account found with that email.';
          break;
        case 'auth/wrong-password':
        case 'auth/invalid-credential':
        case 'auth/invalid-login-credentials':
          errorMessage = 'Incorrect email or password.';
          break;
        case 'auth/too-many-requests':
          errorMessage = 'Too many failed attempts. Please try again in a few minutes.';
          break;
        case 'auth/network-request-failed':
          errorMessage = 'Network error. Check your connection and try again.';
          break;
        default:
          errorMessage = error.message || errorMessage;
      }

      showError(errorMessage);
      loginBtn.disabled = false;
      loginBtn.textContent = originalText;
      passwordInput.value = '';
      passwordInput.focus();
    }
  });

  /* ============================================================
     SERVICE WORKER
  ============================================================ */
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('service-worker.js')
        .then(reg => console.log('✅ Service Worker registered:', reg.scope))
        .catch(err => console.error('❌ Service Worker registration failed:', err));
    });
  }
</script>

</body>
</html>
